<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768">
  <rect width="768" height="768" fill="#1e1e1e"/>
  <!-- construction grid -->
  <g stroke="#4fc3f7" stroke-width="1.5" opacity="0.12">
    <line x1="96" y1="96" x2="96" y2="672"/><line x1="168" y1="96" x2="168" y2="672"/><line x1="240" y1="96" x2="240" y2="672"/><line x1="312" y1="96" x2="312" y2="672"/><line x1="384" y1="96" x2="384" y2="672"/><line x1="456" y1="96" x2="456" y2="672"/><line x1="528" y1="96" x2="528" y2="672"/><line x1="600" y1="96" x2="600" y2="672"/><line x1="672" y1="96" x2="672" y2="672"/>
    <line x1="96" y1="96" x2="672" y2="96"/><line x1="96" y1="168" x2="672" y2="168"/><line x1="96" y1="240" x2="672" y2="240"/><line x1="96" y1="312" x2="672" y2="312"/><line x1="96" y1="384" x2="672" y2="384"/><line x1="96" y1="456" x2="672" y2="456"/><line x1="96" y1="528" x2="672" y2="528"/><line x1="96" y1="600" x2="672" y2="600"/><line x1="96" y1="672" x2="672" y2="672"/>
  </g>
  <!-- faint construction skeleton underneath the S (the 'sketch under the ink') -->
  <path d="M512,236 C512,168 420,150 348,150 C240,150 220,262 300,300
           C392,344 500,340 500,436 C500,540 372,556 276,520
           C244,508 224,486 214,456"
        fill="none" stroke="#ffb74d" stroke-width="2.5"
        stroke-dasharray="7,7" opacity="0.5"/>
  <!-- the S as a thick sketch stroke -->
  <path d="M512,236
           C512,168 420,150 348,150
           C240,150 220,262 300,300
           C392,344 500,340 500,436
           C500,540 372,556 276,520
           C244,508 224,486 214,456"
        fill="none" stroke="#ffb74d" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- snap points (green squares) sitting on the S path's endpoints/nodes -->
  <g fill="#1e1e1e" stroke="#81c784" stroke-width="3.5">
    <rect x="500" y="224" width="18" height="18"/>
    <rect x="288" y="288" width="18" height="18"/>
    <rect x="491" y="427" width="18" height="18"/>
    <rect x="205" y="447" width="18" height="18"/>
  </g>
  <!-- dimension callout with an absurd value (the slop tell) -->
  <g stroke="#4fc3f7" stroke-width="2.5" fill="none" opacity="0.9">
    <line x1="150" y1="150" x2="150" y2="556"/>
    <path d="M150,150 l-8,20 l16,0 Z" fill="#4fc3f7" stroke="none"/>
    <path d="M150,556 l-8,-20 l16,0 Z" fill="#4fc3f7" stroke="none"/>
    <line x1="130" y1="150" x2="170" y2="150"/>
    <line x1="130" y1="556" x2="170" y2="556"/>
  </g>
  <text x="120" y="353" fill="#4fc3f7"
        font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace"
        font-size="37" font-weight="700" letter-spacing="1"
        transform="rotate(-90 120 353)" text-anchor="middle"
        opacity="0.95">= 4.20 &#8776;</text>
</svg>
