name: Build releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag/name for the release (a tag is created if it doesn't exist)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

# Resolve the release tag once for all jobs:
#   - tag push       → the pushed tag (e.g. v1.2.3)
#   - manual dispatch → the tag you type, or an auto "build-<run#>-<sha>" so you
#                       never have to bump/push a version just to cut a build.
env:
  RELEASE_TAG: >-
    ${{ github.event_name == 'push'
        && github.ref_name
        || (inputs.release_tag != ''
            && inputs.release_tag
            || format('build-{0}-{1}', github.run_number, github.sha)) }}

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean slopcad.spec

      - name: Zip output
        run: Compress-Archive -Path dist/slopcad/* -DestinationPath dist/slopcad-windows.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: dist/slopcad-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 fuse

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean slopcad.spec

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Strip bundled GL/XCB libs so system Mesa is used instead
        run: |
          cd dist/slopcad/_internal
          rm -f libGL.so* libGL-*.so* libEGL.so* libEGL-*.so*
          rm -f libxcb-glx.so*

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/slopcad/* AppDir/usr/bin/

          cat > AppDir/slopcad.desktop << 'EOF'
          [Desktop Entry]
          Name=SlopCAD
          Exec=slopcad
          Icon=slopcad
          Type=Application
          Categories=Graphics;
          EOF

          # Placeholder icon (1x1 white PNG) — replace with a real one later
          python3 -c "
          import base64, pathlib
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwADhQGAWjR9awAAAABJRU5ErkJggg==')
          pathlib.Path('AppDir/slopcad.png').write_bytes(png)
          "

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="/usr/lib:/usr/lib/x86_64-linux-gnu:$HERE/usr/bin:$HERE/usr/bin/_internal"
          exec "$HERE/usr/bin/slopcad" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir slopcad-linux.AppImage

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: slopcad-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
