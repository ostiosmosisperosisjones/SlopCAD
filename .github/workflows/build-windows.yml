name: Build releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag/name for the release (a tag is created if it doesn't exist)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

# Resolve the release tag once for all jobs:
#   - tag push       → the pushed tag (e.g. v1.2.3)
#   - manual dispatch → the tag you type, or an auto "build-<run#>-<sha>" so you
#                       never have to bump/push a version just to cut a build.
env:
  RELEASE_TAG: >-
    ${{ github.event_name == 'push'
        && github.ref_name
        || (inputs.release_tag != ''
            && inputs.release_tag
            || format('build-{0}-{1}', github.run_number, github.sha)) }}

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Windows icon
        # slopcad.spec picks up slopcad.ico automatically if present. Build it
        # from the brand avatar with Pillow (already a dependency), multi-res so
        # it looks right in the taskbar and Explorer.
        run: |
          python -c "from PIL import Image; Image.open('brand/avatar-640.png').save('slopcad.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean slopcad.spec

      - name: Zip output
        run: Compress-Archive -Path dist/slopcad/* -DestinationPath dist/slopcad-windows.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: dist/slopcad-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          # libglu1-mesa provides libGLU.so.1. The app calls gluProject/
          # gluPerspective/gluUnProject, and GLU is NOT part of the base GL
          # runtime — many minimal/modern distros don't ship it, so we bundle it
          # into the AppImage below. Unlike libGL/libEGL (driver-coupled, must
          # come from the user's system), GLU is pure vendor-neutral math and is
          # safe to ship.
          sudo apt-get install -y libgl1 libglu1-mesa libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 fuse

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean slopcad.spec

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Strip bundled GL/XCB libs so system Mesa is used instead
        run: |
          cd dist/slopcad/_internal
          rm -f libGL.so* libGL-*.so* libEGL.so* libEGL-*.so*
          rm -f libxcb-glx.so*

      - name: Bundle libGLU (vendor-neutral; not always present on target)
        run: |
          # GLU is safe to ship (pure math, not driver-coupled). Copy the real
          # library from the build host into _internal so gluProject/
          # gluPerspective resolve on minimal distros that lack libglu1-mesa.
          set -e
          glu="$(ldconfig -p | awk '/libGLU\.so\.1/ {print $NF; exit}')"
          if [ -z "$glu" ]; then
            glu="$(find /usr/lib -name 'libGLU.so.1*' 2>/dev/null | head -n1)"
          fi
          if [ -z "$glu" ]; then
            echo "libGLU.so.1 not found on build host" >&2
            exit 1
          fi
          echo "Bundling $glu"
          cp -Lv "$glu" dist/slopcad/_internal/libGLU.so.1

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/slopcad/* AppDir/usr/bin/

          cat > AppDir/slopcad.desktop << 'EOF'
          [Desktop Entry]
          Name=SlopCAD
          Exec=slopcad
          Icon=slopcad
          Type=Application
          Categories=Graphics;
          EOF

          # App icon — the SlopCAD brand avatar (must match Icon=slopcad above).
          cp brand/avatar-640.png AppDir/slopcad.png

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="/usr/lib:/usr/lib/x86_64-linux-gnu:$HERE/usr/bin:$HERE/usr/bin/_internal"
          exec "$HERE/usr/bin/slopcad" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir slopcad-linux.AppImage

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: slopcad-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
